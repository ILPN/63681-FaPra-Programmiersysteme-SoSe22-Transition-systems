<div fxLayout="column" fxLayoutAlign="start center">
    {{buttonText}}
    <div class="interactive-square" fxLayout="row" fxLayoutAlign="center center"
         (mouseenter)="hoverStart($event)"
         (mouseleave)="hoverEnd($event)">
        <mat-icon class="larger-icon">
            {{buttonIcon}}
        </mat-icon>
        <button title="Deadlocks: red, Transitions that could die: orange, Cycles: blue">Hover me!</button>
    </div>
</div>
